[project]
name = "opengen1"
version = "0.1.0"
description = "OpenGen-1 multimodal physical foundation model prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "hydra-core>=1.3.2",
  "numpy>=1.26.4",
  "omegaconf>=2.3.0",
  "tensorboard>=2.16.2",
  "timm>=1.0.7",
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "tqdm>=4.66.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
